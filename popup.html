<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Token Monitor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 280px; background: #0f0f1a; color: #e0e0e0; font-family: monospace; padding: 16px; }
    h1 { font-size: 13px; color: #4a9eff; margin-bottom: 14px; letter-spacing: 0.4px; }
    label { color: #cccccc; font-size: 11px; display: block; margin-bottom: 6px; }
    input[type="number"] { width: 100%; background: #1e1e2e; border: 1px solid #666; border-radius: 6px; color: #fff; padding: 8px 10px; font-family: monospace; margin-bottom: 10px; }
    button { width: 100%; background: #4a9eff; color: #fff; border: none; border-radius: 6px; padding: 8px; font-family: monospace; cursor: pointer; }
    .saved { text-align: center; color: #4ade80; font-size: 11px; margin-top: 8px; display: none; }
    .note { margin-top: 12px; font-size: 10px; color: #aaa; line-height: 1.7; }
  </style>
</head>
<body>
  <h1>⚡ AI TOKEN MONITOR</h1>
  <label for="limitInput">トークン上限値（デフォルト: 100,000）</label>
  <input type="number" id="limitInput" value="100000" min="1000" step="1000">
  <button id="saveBtn">保存</button>
  <div class="saved" id="savedMsg">✓ 保存しました</div>

  <div class="note">
    対応: claude.ai/chat, chatgpt.com/codex<br>
    80%以上: ⚠️ / 95%以上: 🚨<br>
    ※表示は推定トークンです
  </div>

  <script src="popup.js"></script>
</body>
</html>
